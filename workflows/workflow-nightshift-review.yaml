        dependsOn: []
      - name: evaluate-review
        task:
          type: model_method
          modelIdOrName: ${{ inputs.factory }}
          methodName: evaluate_review
          inputs:
            workItem: ${{ inputs.workItem }}
            runId: ${{ run.id }}
            phase: ${{ inputs.phase }}
            reviews: >-
              ${{ [data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse,
                    data.latest("nightshift-clean-code", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-clean-code-" + run.id).attributes.parsedResponse,
                    data.latest("nightshift-frontend", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-frontend-" + run.id).attributes.parsedResponse,
                    data.latest("nightshift-ddd", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-ddd-" + run.id).attributes.parsedResponse,
                    data.latest("nightshift-security", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-security-" + run.id).attributes.parsedResponse,
                    data.latest("nightshift-accessibility", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-accessibility-" + run.id).attributes.parsedResponse,
                    data.latest("nightshift-observability", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-observability-" + run.id).attributes.parsedResponse] }}
        dependsOn:
          - { step: test-coverage, condition: { type: succeeded } }
          - { step: clean-code, condition: { type: succeeded } }
          - { step: frontend, condition: { type: succeeded } }
          - { step: ddd, condition: { type: succeeded } }
          - { step: security, condition: { type: succeeded } }
          - { step: accessibility, condition: { type: succeeded } }
          - { step: observability, condition: { type: succeeded } }
      - name: record-review
        task:
          type: model_method
          modelIdOrName: ${{ inputs.factory }}
          methodName: record_artifact
          inputs:
            workItem: ${{ inputs.workItem }}
            name: ${{ inputs.artifactName }}
            payload:
              findings: ${{ data.latest(inputs.factory, "review-" + inputs.workItem + "-" + run.id).attributes.findings }}
        dependsOn:
          - { step: evaluate-review, condition: { type: succeeded } }
      - name: record-review-run
        task:
          type: model_method
          modelIdOrName: ${{ inputs.factory }}
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: ${{ inputs.artifactName + "-run" }}
            payload:
              status: succeeded
              runId: ${{ run.id }}
        dependsOn:
          - { step: publish-review, condition: { type: succeeded } }
      - name: publish-review
        task:
          type: model_method
          modelIdOrName: nightshift-issues
          methodName: publish_review
          inputs:
            issue_number: ${{ int(inputs.workItem) }}
            phase: ${{ inputs.phase }}
            publication_key: ${{ run.id }}
            findings: ${{ data.latest(inputs.factory, "artifact-" + inputs.workItem + "-" + inputs.artifactName).attributes.payload.findings }}
        dependsOn:
          - { step: record-review, condition: { type: succeeded } }
    dependsOn:
      - { job: verify-tests, condition: { type: succeeded } }
version: 9
