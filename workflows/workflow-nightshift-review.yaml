      - name: validate-test-coverage
        task:
          type: assert
          expr: >-
            data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.lane == "test-coverage"
            && data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.verdict in ["pass", "warn", "fail"]
            && size(data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.findings) > 0
            && data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.findings.all(f, f.id.startsWith("TC-") && f.category in ["test-coverage:pass", "test-coverage:warn", "test-coverage:fail"])
            && ((data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.verdict == "pass" && data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.findings.all(f, f.severity == "low")) || (data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.verdict == "warn" && data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.findings.exists(f, f.severity == "medium") && data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.findings.all(f, f.severity in ["low", "medium"])) || (data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.verdict == "fail" && data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.summary.contains("Strange things are afoot at the Circle K") && data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.findings.exists(f, f.severity == "high") && data.latest("nightshift-test-coverage", "invocation-nightshift-" + inputs.workItem + "-" + inputs.phase + "-test-coverage-" + run.id).attributes.parsedResponse.findings.all(f, f.severity != "high" || f.description.contains("Strange things are afoot at the Circle K"))))
