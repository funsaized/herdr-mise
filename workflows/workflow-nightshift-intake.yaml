id: ca20d478-5c75-4e42-934a-881fe2e29656
name: nightshift-intake
description: Refresh GitHub issue context and start a matching Nightshift factory run.
tags:
  factory: nightshift
inputs:
  properties:
    workItem:
      type: string
      pattern: '^[1-9][0-9]*$'
      maxLength: 16
      description: GitHub issue number as a string; this is the factory work-item key.
    issueNumber:
      type: integer
      minimum: 1
  required: [workItem, issueNumber]
jobs:
  - name: intake
    description: Bind one GitHub issue to one factory work item.
    steps:
      - name: matching-identities
        task:
          type: assert
          expr: int(inputs.workItem) == inputs.issueNumber
          message: workItem must be the decimal GitHub issue number.
          severity: high
        dependsOn: []
      - name: start-issue
        guard: ${{ data.latest("nightshift-issues", "state-issue-" + inputs.workItem) != null }}
        task:
          type: model_method
          modelIdOrName: nightshift-issues
          methodName: start
          inputs:
            issue_number: ${{ inputs.issueNumber }}
        dependsOn:
          - step: matching-identities
            condition: { type: succeeded }
      # ponytail: controlled single writer; require atomic create-if-absent before exposing intake to multiple writers.
      - name: start-factory
        guard: '${{ size(data.query(''modelType == "@swamp/software-factory" && name == "state-'' + inputs.workItem + ''"'')) > 0 }}'
        task:
          type: model_method
          modelType: '@swamp/software-factory'
          modelName: ${{ "nightshift-run-" + inputs.workItem }}
          methodName: start
          globalArgs:
            stages: ${{ model.nightshift-template.definition.globalArguments.stages }}
            globalTransitions: ${{ model.nightshift-template.definition.globalArguments.globalTransitions }}
          inputs:
            workItem: ${{ inputs.workItem }}
        allowFailure: true
        dependsOn:
          - step: start-issue
            condition: { type: completed }
      - name: require-single-factory-owner
        task:
          type: assert
          expr: >-
            size(data.query('modelType == "@swamp/software-factory" && name == "state-' + inputs.workItem + '"')) == 1 && size(data.query('modelType == "@swamp/software-factory" && name == "state-' + inputs.workItem + '" && attributes.workItem == "' + inputs.workItem + '" && (modelName == "the-nightshift" || modelName == "nightshift-run-' + inputs.workItem + '")')) == 1
          message: Work item must have exactly one valid legacy or runtime factory owner
          severity: high
        dependsOn:
          - step: start-factory
            condition: { type: completed }
    dependsOn: []
version: 5
