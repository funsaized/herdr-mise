id: c54281ad-6cca-498e-b51a-5412a19ccb9a
name: nightshift-advance
description: Advance one factory work item and reconcile its authoritative stage.
tags:
  factory: nightshift
  operation: advance
inputs:
  properties:
    workItem:
      type: string
      pattern: '^[0-9]+$'
      maxLength: 16
    transition:
      type: string
      minLength: 1
  required: [workItem, transition]
jobs:
  - name: advance
    description: Reconcile only after the factory transition succeeds.
    steps:
      - name: advance-factory
        task:
          type: model_method
          modelIdOrName: the-nightshift
          methodName: advance
          inputs:
            workItem: ${{ inputs.workItem }}
            transition: ${{ inputs.transition }}
        dependsOn: []
      - name: reconcile-project
        task:
          type: workflow
          workflowIdOrName: nightshift-project-sync
        dependsOn:
          - step: advance-factory
            condition: { type: succeeded }
    dependsOn: []
version: 1
