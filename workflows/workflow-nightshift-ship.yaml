id: c0e70086-74e9-4b5b-b0d8-0c03eb68ef3d
name: nightshift-ship
description: Verify an exact commit for human merge review.
tags:
  factory: nightshift
  stage: ship
inputs:
  properties:
    factory:
      type: string
      pattern: '^[a-z0-9_-]+$'
      maxLength: 64
    workItem:
      type: string
      pattern: '^[1-9][0-9]*$'
      maxLength: 16
    commit:
      type: string
      pattern: '^[0-9a-f]{40}$'
    baseCommit:
      type: string
      pattern: '^[0-9a-f]{40}$'
    subjectRoot:
      type: string
      minLength: 1
    prUrl:
      type: string
      minLength: 1
  required: [factory, workItem, commit, baseCommit, subjectRoot, prUrl]
jobs:
  - name: ship
    description: Verify the exact commit before human merge review.
    steps:
      - name: require-issue-link
        task:
          type: model_method
          modelIdOrName: nightshift-github
          methodName: require_issue_link
          inputs:
            workItem: ${{ inputs.workItem }}
            repo: funsaized/herdr-mise
            prUrl: ${{ inputs.prUrl }}
            commit: ${{ inputs.commit }}
        dependsOn: []
      - name: prepare-ship-workspace
        task:
          type: model_method
          modelIdOrName: verification-source-git
          methodName: prepare_workspace
          inputs:
            workItem: ${{ "ship-" + inputs.workItem }}
            directoryName: ${{ "herdr-mise-ship-" + inputs.workItem }}
            repositoryUrl: https://github.com/funsaized/herdr-mise.git
            workspaceRoot: ..
            baseRef: ${{ inputs.commit }}
            branch: ${{ "nightshift/ship-" + inputs.workItem }}
        dependsOn:
          - { step: require-issue-link, condition: { type: succeeded } }
      - name: verify-candidate
        task:
          type: workflow
          workflowIdOrName: verification
          inputs:
            commit: ${{ inputs.commit }}
            baseCommit: ${{ inputs.baseCommit }}
            subjectRoot: ${{ data.latest("verification-source-git", "workspace-ship-" + inputs.workItem).attributes.subjectRoot }}
        dependsOn:
          - { step: prepare-ship-workspace, condition: { type: succeeded } }
      - name: cleanup-ship-workspace
        task:
          type: model_method
          modelIdOrName: verification-source-git
          methodName: cleanup_workspace
          inputs:
            workItem: ${{ "ship-" + inputs.workItem }}
            subjectRoot: ${{ data.latest("verification-source-git", "workspace-ship-" + inputs.workItem).attributes.subjectRoot }}
        dependsOn:
          - step: verify-candidate
            condition:
              type: or
              conditions:
                - { type: completed }
                - { type: skipped }
      - name: record-shipping-run
        task:
          type: model_method
          modelIdOrName: ${{ inputs.factory }}
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: shipping-run
            payload:
              status: succeeded
              runId: ${{ run.id }}
              outputs:
                failureKind: none
        dependsOn:
          - { step: verify-candidate, condition: { type: succeeded } }
          - { step: cleanup-ship-workspace, condition: { type: succeeded } }
    dependsOn: []
version: 7
