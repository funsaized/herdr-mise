id: c0e70086-74e9-4b5b-b0d8-0c03eb68ef3d
name: nightshift-ship
description: Consume trusted managed verification for the exact current candidate.
tags:
  factory: nightshift
  stage: ship
inputs:
  properties:
    factory:
      type: string
      pattern: '^[a-z0-9_-]+$'
      maxLength: 64
    workItem:
      type: string
      pattern: '^[1-9][0-9]*$'
      maxLength: 16
    commit:
      type: string
      pattern: '^[0-9a-f]{40}$'
    baseCommit:
      type: string
      pattern: '^[0-9a-f]{40}$'
    subjectRoot:
      type: string
      minLength: 1
    prUrl:
      type: string
      minLength: 1
  required: [factory, workItem, commit, baseCommit, subjectRoot, prUrl]
jobs:
  - name: ship
    description: Verify the exact commit before human merge review.
    steps:
      - name: require-issue-link
        task:
          type: model_method
          modelIdOrName: nightshift-github
          methodName: require_issue_link
          inputs:
            workItem: ${{ inputs.workItem }}
            repo: funsaized/herdr-mise
            prUrl: ${{ inputs.prUrl }}
            commit: ${{ inputs.commit }}
        dependsOn: []
      - name: require-managed-verification
        task:
          type: model_method
          modelIdOrName: nightshift-github
          methodName: require_managed_verification
          inputs:
            workItem: ${{ inputs.workItem }}
            prUrl: ${{ inputs.prUrl }}
            commit: ${{ inputs.commit }}
            baseCommit: ${{ inputs.baseCommit }}
        dependsOn:
          - { step: require-issue-link, condition: { type: succeeded } }
      - name: record-managed-verification
        task:
          type: model_method
          modelIdOrName: ${{ inputs.factory }}
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: managed-verification
            payload: ${{ data.latest("nightshift-github", "managed-" + inputs.workItem + "-" + inputs.commit).attributes.result }}
        dependsOn:
          - { step: require-managed-verification, condition: { type: succeeded } }
      - name: record-shipping-run
        task:
          type: model_method
          modelIdOrName: ${{ inputs.factory }}
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: shipping-run
            payload:
              status: succeeded
              runId: ${{ run.id }}
              outputs:
                failureKind: none
                gateRunId: ${{ data.latest("nightshift-github", "managed-" + inputs.workItem + "-" + inputs.commit).attributes.result.gateRunId }}
        dependsOn:
          - { step: record-managed-verification, condition: { type: succeeded } }
    dependsOn: []
version: 8
