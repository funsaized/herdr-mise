id: c0e70086-74e9-4b5b-b0d8-0c03eb68ef3d
name: nightshift-ship
description: Verify an exact commit for human merge review.
tags:
  factory: nightshift
  stage: ship
inputs:
  properties:
    workItem:
      type: string
      minLength: 1
    commit:
      type: string
      pattern: '^[0-9a-f]{40}$'
    baseCommit:
      type: string
      pattern: '^[0-9a-f]{40}$'
    subjectRoot:
      type: string
      minLength: 1
    prUrl:
      type: string
      minLength: 1
  required: [workItem, commit, baseCommit, subjectRoot, prUrl]
jobs:
  - name: ship
    description: Verify the exact commit before human merge review.
    steps:
      - name: require-issue-link
        task:
          type: model_method
          modelIdOrName: nightshift-github
          methodName: require_issue_link
          inputs:
            workItem: ${{ inputs.workItem }}
            repo: funsaized/herdr-mise
            prUrl: ${{ inputs.prUrl }}
        dependsOn: []
      - name: verify-candidate
        task:
          type: workflow
          workflowIdOrName: verification
          inputs:
            commit: ${{ inputs.commit }}
            baseCommit: ${{ inputs.baseCommit }}
            subjectRoot: ${{ inputs.subjectRoot }}
        dependsOn:
          - { step: require-issue-link, condition: { type: succeeded } }
      - name: record-shipping-run
        task:
          type: model_method
          modelIdOrName: the-nightshift
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: shipping-run
            payload:
              status: succeeded
              runId: ${{ run.id }}
              outputs:
                failureKind: none
        dependsOn:
          - { step: verify-candidate, condition: { type: succeeded } }
    dependsOn: []
version: 5
