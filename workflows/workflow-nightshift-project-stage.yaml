id: 22660784-4b04-46c2-895f-c21ad41d7865
name: nightshift-project-stage
description: Project one authoritative Nightshift stage into GitHub Project 2.
tags:
  factory: nightshift
  operation: stage-projection
inputs:
  properties:
    workItem:
      type: string
      pattern: '^[0-9]+$'
      maxLength: 16
    stageId:
      type: string
      enum:
        [planning, plan-review, building, code-review, ship-prep, shipping, await-merge, deployed-verification, closing, done, aborted]
    authoritativeStageId:
      type: string
      default: ''
    evidenceName:
      type: string
      default: ''
  required: [workItem, stageId]
jobs:
  - name: project
    description: Reconcile the issue from the factory stage and record the result.
    steps:
      - name: require-authoritative-stage
        guard: ${{ inputs.stageId in ["done", "aborted"] }}
        task:
          type: assert
          expr: 'data.latest("the-nightshift", "state-" + inputs.workItem).attributes.stageId == (inputs.authoritativeStageId == "" ? inputs.stageId : inputs.authoritativeStageId)'
          message: Project updates must match the authoritative factory stage.
          severity: high
        dependsOn: []
      - name: sync-project-item
        task:
          type: model_method
          modelIdOrName: nightshift-github
          methodName: sync_project_items
          inputs:
            owner: funsaized
            projectNumber: 2
            items:
              - issueNumber: ${{ int(inputs.workItem) }}
                stageId: ${{ inputs.stageId }}
        dependsOn:
          - step: require-authoritative-stage
            condition:
              type: or
              conditions:
                - { type: succeeded }
                - { type: skipped }
      - name: require-complete-sync
        task:
          type: assert
          expr: data.latest("nightshift-github", "project-sync-" + inputs.workItem).attributes.items.all(item, item.issueNumber == int(inputs.workItem) && item.result != "failed")
          message: GitHub Project 2 stage projection failed; inspect the method-summary report.
          severity: high
        dependsOn:
          - { step: sync-project-item, condition: { type: succeeded } }
      - name: record-stage-projection
        guard: ${{ inputs.evidenceName == "" }}
        task:
          type: model_method
          modelIdOrName: the-nightshift
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: ${{ inputs.evidenceName }}
            payload:
              status: succeeded
              runId: ${{ run.id }}
              outputs:
                stageId: ${{ inputs.stageId }}
        dependsOn:
          - { step: require-complete-sync, condition: { type: succeeded } }
    dependsOn: []
version: 1
