id: a6621866-b73d-4b34-9621-482cfab8038b
name: nightshift-close
description: Safely clean the worktree and record factory closure evidence.
tags:
  factory: nightshift
  stage: closing
inputs:
  properties:
    workItem:
      type: string
      minLength: 1
    subjectRoot:
      type: string
      minLength: 1
  required: [workItem, subjectRoot]
jobs:
  - name: close
    description: Remove only a clean worktree and record the result.
    steps:
      - name: cleanup-workspace
        task:
          type: model_method
          modelIdOrName: verification-source-git
          methodName: cleanup_workspace
          inputs:
            workItem: ${{ inputs.workItem }}
            subjectRoot: ${{ inputs.subjectRoot }}
        dependsOn: []
      - name: record-close-run
        task:
          type: model_method
          modelIdOrName: the-nightshift
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: close-run
            payload:
              status: succeeded
              runId: ${{ run.id }}
              outputs:
                cleanup: ${{ data.latest("verification-source-git", "cleanup-" + inputs.workItem).attributes }}
        dependsOn:
          - { step: cleanup-workspace, condition: { type: succeeded } }
    dependsOn: []
version: 3
