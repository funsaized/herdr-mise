id: 8b7c8637-59c3-4dac-9ed9-6dea253e27e1
name: nightshift-project-sync
description: Project authoritative factory stages into GitHub Project 2.
tags:
  factory: nightshift
  operation: reconciliation
jobs:
  - name: reconcile
    description: Refresh the fleet view and reconcile every issue in one GitHub call.
    steps:
      - name: refresh-factory-status
        task:
          type: model_method
          modelIdOrName: the-nightshift
          methodName: status
        dependsOn: []
      - name: sync-project-items
        task:
          type: model_method
          modelIdOrName: nightshift-github
          methodName: sync_project_items
          inputs:
            owner: funsaized
            projectNumber: 2
            items: >-
              ${{ data.latest("the-nightshift", "status-_factory").attributes.runs.map(item, {"issueNumber": int(item.workItem), "stageId": item.stageId}) }}
        dependsOn:
          - step: refresh-factory-status
            condition: { type: succeeded }
      - name: require-complete-sync
        task:
          type: assert
          expr: data.latest("nightshift-github", "project-sync").attributes.items.all(item, item.result != "failed")
          message: One or more GitHub Project 2 items failed to reconcile; inspect the method-summary report.
          severity: high
        dependsOn:
          - step: sync-project-items
            condition: { type: succeeded }
    dependsOn: []
version: 1
