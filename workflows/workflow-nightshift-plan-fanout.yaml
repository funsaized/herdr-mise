id: 0874a7b0-f735-4c5f-9bbf-c66eb9bfa481
name: nightshift-plan-fanout
description: Plan queued work items serially through the shared planner model.
tags:
  factory: nightshift
  stage: plan
inputs:
  properties:
    workItems:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        pattern: '^[1-9][0-9]*$'
        maxLength: 16
  required: [workItems]
jobs:
  - name: plan-queued-items
    description: Each child workflow owns one canonical GitHub issue number.
    steps:
      - name: plan-${{ self.entry.workItem }}
        forEach:
          item: entry
          in: '${{ inputs.workItems.map(w, {"workItem": w, "factory": w == "77" ? "the-nightshift" : "nightshift-run-" + w}) }}'
        concurrency: 1
        task:
          type: workflow
          workflowIdOrName: nightshift-plan
          inputs:
            factory: ${{ self.entry.factory }}
            workItem: ${{ self.entry.workItem }}
            issueNumber: ${{ int(self.entry.workItem) }}
            reviewFeedback: ${{ data.latest(self.entry.factory, "artifact-" + self.entry.workItem + "-plan-review").?attributes.?payload.?findings.orValue([]) }}
            currentPlan: ${{ data.latest(self.entry.factory, "artifact-" + self.entry.workItem + "-plan").?attributes.?payload.orValue({}) }}
            humanFeedback: '${{ data.latest(self.entry.factory, "artifact-" + self.entry.workItem + "-plan-feedback").?attributes.?subjectVersion.orValue(0) == data.latest(self.entry.factory, "artifact-" + self.entry.workItem + "-plan").?version.orValue(-1) ? data.latest(self.entry.factory, "artifact-" + self.entry.workItem + "-plan-feedback").attributes.payload.feedback : "" }}'
        dependsOn: []
    dependsOn: []
version: 3
