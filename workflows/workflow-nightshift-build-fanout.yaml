id: b4d98b0d-84f2-43de-9385-7b21d786fa84
name: nightshift-build-fanout
description: Build independent ready work items with at most two concurrent builders.
tags:
  factory: nightshift
  stage: build
inputs:
  properties:
    workItems:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        pattern: '^[1-9][0-9]*$'
        maxLength: 16
  required: [workItems]
jobs:
  - name: build-ready-items
    description: Each child workflow owns one work item and workspace.
    steps:
      - name: build-${{ self.entry.workItem }}
        forEach:
          item: entry
          in: '${{ inputs.workItems.map(w, {"workItem": w, "factory": w == "77" ? "the-nightshift" : "nightshift-run-" + w}) }}'
        concurrency: 2
        task:
          type: workflow
          workflowIdOrName: nightshift-build
          inputs:
            factory: ${{ self.entry.factory }}
            workItem: ${{ self.entry.workItem }}
            plan: ${{ data.latest(self.entry.factory, "artifact-" + self.entry.workItem + "-plan").attributes.payload }}
            reviewFeedback: ${{ data.latest(self.entry.factory, "artifact-" + self.entry.workItem + "-code-review").?attributes.?payload.?findings.orValue([]) }}
        dependsOn: []
    dependsOn: []
version: 4
