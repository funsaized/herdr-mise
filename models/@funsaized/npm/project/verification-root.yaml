type: '@funsaized/npm/project'
typeVersion: 2026.08.26.3
id: e40b7444-cebe-4008-90a0-730a9e1137c0
name: verification-root
version: 1
tags: {}
globalArguments:
  projectDir: .
  strictToolchain: false
  configPolicy: project
  lifecycleScripts: allow
  allowedScripts:
    - format:check
    - build
    - typecheck
    - lint
    - test
    - check:herdr-compatibility
    - test:visual
    - test:hosted
    - audit:tokens
    - audit:accessibility
