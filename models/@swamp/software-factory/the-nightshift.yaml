type: "@swamp/software-factory"
typeVersion: 2026.06.24.1
id: 0ad3b6ba-3337-4449-87b4-640e1b3eebfc
name: the-nightshift
version: 7
tags: {}
globalArguments:
    stages:
        - id: planning
          description: Refresh the GitHub issue, qualify scope, and record an implementation plan.
          initial: true
          maxCycles: 5
          work:
              mode: workflow
              workflow:
                  name: nightshift-plan
                  inputs:
                      workItem: "${{ self.workItem }}"
                      issueNumber: "${{ double(self.workItem) }}"
                      reviewFeedback: '${{ data.latest(self.name, "artifact-plan-review").?payload.?findings.orValue([]) }}'
                      currentPlan: '${{ data.latest(self.name, "artifact-plan").?payload.orValue({}) }}'
                      humanFeedback: '${{ data.latest(self.name, "artifact-plan-feedback").?subjectVersion.orValue(0) == data.latest(self.name, "artifact-plan").?version.orValue(-1) ? data.latest(self.name, "artifact-plan-feedback").payload.feedback : "" }}'
              resultEvidence: planning-run
          artifacts:
              - name: plan
                schema:
                    type: object
                    required:
                        [summary, steps, testingStrategy, risks, outOfScope]
                    properties:
                        summary: { type: string, minLength: 1 }
                        steps:
                            type: array
                            minItems: 1
                            items: { type: string, minLength: 1 }
                        testingStrategy: { type: string, minLength: 1 }
                        risks:
                            type: array
                            items: { type: string, minLength: 1 }
                        outOfScope:
                            type: array
                            items: { type: string, minLength: 1 }
          transitions:
              - name: submit
                to: plan-review
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: planning-run,
                              requireField: { status: succeeded },
                          }
                    - type: artifact-exists
                      config: { artifact: plan }

        - id: plan-review
          description: Run seven isolated reviewers against the current plan.
          maxCycles: 4
          work:
              mode: workflow
              workflow:
                  name: nightshift-review
                  inputs:
                      workItem: "${{ self.workItem }}"
                      phase: plan
                      artifactName: plan-review
                      subject: '${{ data.latest(self.name, "artifact-plan").payload }}'
                      subjectRoot: .
              resultEvidence: plan-review-run
          artifacts:
              - name: plan-review
                kind: findings
                reviews: plan
          transitions:
              - name: approve
                to: building
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: plan-review-run,
                              requireField: { status: succeeded },
                          }
                    - type: artifact-fresh
                      config: { artifact: plan-review, recordedThisCycle: true }
                    - type: findings-clear
                      config: { artifact: plan-review, blocking: [high] }
                    - type: cel
                      config:
                          expr: 'artifacts.plan_review.findings.exists(f, f.id == "ROUND" && f.category in ["round:pass", "round:warn"])'
                          message: The plan review round must resolve to pass or warn.
                    - type: human-approval
                      config: { id: plan-approval }
              - name: rework
                to: planning
                gates:
                    - type: artifact-fresh
                      config: { artifact: plan-review, recordedThisCycle: true }
                    - type: cel
                      config:
                          expr: 'artifacts.plan_review.findings.exists(f, f.id == "ROUND" && f.category == "round:fail")'
                          message: Rework is available only for a failed plan review round.
                    - type: max-cycles
                      config: { stage: plan-review, limit: 4 }
              - name: park
                to: parked
                gates:
                    - type: artifact-fresh
                      config: { artifact: plan-review, recordedThisCycle: true }
                    - type: cel
                      config:
                          expr: 'artifacts.plan_review.findings.exists(f, f.id == "ROUND" && f.category == "round:fail")'
                          message: Parking is available only for a failed plan review round.
                    - type: max-cycles
                      config: { stage: plan-review, limit: 4, invert: true }
              - name: retry
                to: plan-review
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: plan-review-run,
                              requireField: { status: failed },
                          }
                    - type: cel
                      config:
                          expr: 'evidence.plan_review_run.outputs.failureKind in ["configuration", "infrastructure"]'
                          message: Only configuration or infrastructure failures retry plan review.
              - name: request-rework
                to: plan-feedback
                manual: true
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: plan-review-run,
                              requireField: { status: succeeded },
                          }
                    - type: artifact-fresh
                      config: { artifact: plan-review, recordedThisCycle: true }
                    - type: cel
                      config:
                          expr: 'artifacts.plan_review.findings.exists(f, f.id == "ROUND" && f.category in ["round:pass", "round:warn"])'
                          message: Human-requested rework is available only after a passing plan review round.

        - id: plan-feedback
          description: Persist human feedback against the reviewed plan before revision.
          maxCycles: 5
          work:
              mode: interactive
          artifacts:
              - name: plan-feedback
                reviews: plan
                schema:
                    type: object
                    required: [feedback]
                    properties:
                        feedback: { type: string, minLength: 1 }
          transitions:
              - name: revise
                to: planning
                gates:
                    - type: artifact-fresh
                      config: { artifact: plan-feedback, recordedThisCycle: true }

        - id: building
          description: Implement the approved plan without committing or pushing.
          maxCycles: 5
          work:
              mode: workflow
              workflow:
                  name: nightshift-build
                  inputs:
                      workItem: "${{ self.workItem }}"
                      plan: '${{ data.latest(self.name, "artifact-plan").payload }}'
                      reviewFeedback: '${{ data.latest(self.name, "artifact-code-review").?payload.?findings.orValue([]) }}'
              resultEvidence: build-run
          artifacts:
              - name: workspace
                schema:
                    type: object
                    required: [workItem, subjectRoot, branch, baseCommit]
                    properties:
                        workItem: { type: string, minLength: 1 }
                        subjectRoot: { type: string, pattern: "^/" }
                        branch: { type: string, minLength: 1 }
                        baseCommit: { type: string, pattern: "^[0-9a-f]{40}$" }
              - name: change-summary
                schema:
                    type: object
                    required: [summary, files, tests, branch, baseCommit]
                    properties:
                        summary: { type: string, minLength: 1 }
                        files:
                            type: array
                            minItems: 1
                            items: { type: string, minLength: 1 }
                        tests:
                            type: array
                            minItems: 1
                            items: { type: string, minLength: 1 }
                        branch: { type: string, minLength: 1 }
                        baseCommit: { type: string, pattern: "^[0-9a-f]{40}$" }
          transitions:
              - name: submit
                to: code-review
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: build-run,
                              requireField: { status: succeeded },
                          }
                    - type: artifact-exists
                      config: { artifact: change-summary }

        - id: code-review
          description: Run seven isolated reviewers against the written code and tests.
          maxCycles: 4
          work:
              mode: workflow
              workflow:
                  name: nightshift-review
                  inputs:
                      workItem: "${{ self.workItem }}"
                      phase: code
                      artifactName: code-review
                      subject: '${{ data.latest(self.name, "artifact-change-summary").payload }}'
                      subjectRoot: '${{ data.latest(self.name, "artifact-workspace").payload.subjectRoot }}'
              resultEvidence: code-review-run
          artifacts:
              - name: code-review
                kind: findings
                reviews: change-summary
          transitions:
              - name: approve
                to: ship-prep
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: code-review-run,
                              requireField: { status: succeeded },
                          }
                    - type: artifact-fresh
                      config: { artifact: code-review, recordedThisCycle: true }
                    - type: findings-clear
                      config: { artifact: code-review, blocking: [high] }
                    - type: cel
                      config:
                          expr: 'artifacts.code_review.findings.exists(f, f.id == "ROUND" && f.category in ["round:pass", "round:warn"])'
                          message: The code review round must resolve to pass or warn.
              - name: rework
                to: building
                gates:
                    - type: artifact-fresh
                      config: { artifact: code-review, recordedThisCycle: true }
                    - type: cel
                      config:
                          expr: 'artifacts.code_review.findings.exists(f, f.id == "ROUND" && f.category == "round:fail")'
                          message: Rework is available only for a failed code review round.
                    - type: max-cycles
                      config: { stage: code-review, limit: 4 }
              - name: park
                to: parked
                gates:
                    - type: artifact-fresh
                      config: { artifact: code-review, recordedThisCycle: true }
                    - type: cel
                      config:
                          expr: 'artifacts.code_review.findings.exists(f, f.id == "ROUND" && f.category == "round:fail")'
                          message: Parking is available only for a failed code review round.
                    - type: max-cycles
                      config: { stage: code-review, limit: 4, invert: true }
              - name: retry
                to: code-review
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: code-review-run,
                              requireField: { status: failed },
                          }
                    - type: cel
                      config:
                          expr: 'evidence.code_review_run.outputs.failureKind in ["configuration", "infrastructure"]'
                          message: Only configuration or infrastructure failures retry code review.

        - id: parked
          description: Wait for explicit human approval before another planning or building attempt.
          transitions:
              - name: rework-plan
                to: planning
                gates:
                    - type: human-approval
                      config: { id: rework-parked }
              - name: rework-build
                to: building
                gates:
                    - type: human-approval
                      config: { id: rework-parked-build }
                    - type: artifact-exists
                      config: { artifact: change-summary }

        - id: ship-prep
          description: A human creates and reviews the clean commit and pull request candidate.
          maxCycles: 5
          work:
              mode: interactive
              constraints: agent-constraints/ship-prep.md
          artifacts:
              - name: release-candidate
                schema:
                    type: object
                    required: [commit, baseCommit, subjectRoot, prUrl, branch]
                    properties:
                        commit: { type: string, pattern: "^[0-9a-f]{40}$" }
                        baseCommit: { type: string, pattern: "^[0-9a-f]{40}$" }
                        subjectRoot: { type: string, minLength: 1 }
                        prUrl: { type: string, minLength: 1 }
                        branch: { type: string, minLength: 1 }
          transitions:
              - name: ship
                to: shipping
                gates:
                    - type: artifact-exists
                      config: { artifact: release-candidate }
                    - type: human-approval
                      config: { id: ship-approval }

        - id: shipping
          description: Verify the exact commit before human merge review.
          maxCycles: 5
          work:
              mode: workflow
              workflow:
                  name: nightshift-ship
                  inputs:
                      workItem: "${{ self.workItem }}"
                      commit: '${{ data.latest(self.name, "artifact-release-candidate").payload.commit }}'
                      baseCommit: '${{ data.latest(self.name, "artifact-release-candidate").payload.baseCommit }}'
                      subjectRoot: '${{ data.latest(self.name, "artifact-release-candidate").payload.subjectRoot }}'
                      prUrl: '${{ data.latest(self.name, "artifact-release-candidate").payload.prUrl }}'
              resultEvidence: shipping-run
          transitions:
              - name: complete
                to: await-merge
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: shipping-run,
                              requireField: { status: succeeded },
                          }
              - name: rework
                to: building
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: shipping-run,
                              requireField: { status: failed },
                          }
                    - type: cel
                      config:
                          expr: 'evidence.shipping_run.outputs.failureKind == "candidate"'
                          message: Only candidate failures return to building.
              - name: retry
                to: shipping
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: shipping-run,
                              requireField: { status: failed },
                          }
                    - type: cel
                      config:
                          expr: 'evidence.shipping_run.outputs.failureKind in ["configuration", "infrastructure"]'
                          message: Only configuration or infrastructure failures retry shipping.

        - id: await-merge
          description: Wait for an explicit human decision on the verified pull request.
          maxCycles: 5
          transitions:
              - name: close
                to: deployed-verification
                gates:
                    - type: human-approval
                      config: { id: merge-confirmation }
              - name: rework
                to: building
                gates:
                    - type: human-approval
                      config: { id: merge-rework }

        - id: deployed-verification
          description: Run hosted smoke from the exact merged pull-request commit.
          maxCycles: 5
          work:
              mode: workflow
              workflow:
                  name: nightshift-deployed-verification
                  inputs:
                      workItem: "${{ self.workItem }}"
                      candidateCommit: '${{ data.latest(self.name, "artifact-release-candidate").payload.commit }}'
                      prUrl: '${{ data.latest(self.name, "artifact-release-candidate").payload.prUrl }}'
              resultEvidence: hosted-smoke-run
          transitions:
              - name: complete
                to: closing
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: hosted-smoke-run,
                              requireField: { status: succeeded },
                          }
              - name: retry
                to: deployed-verification
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: hosted-smoke-run,
                              requireField: { status: failed },
                          }
                    - type: cel
                      config:
                          expr: 'evidence.hosted_smoke_run.outputs.failureKind in ["configuration", "infrastructure"]'
                          message: Only configuration or infrastructure failures retry hosted smoke.
              - name: rework
                to: building
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: hosted-smoke-run,
                              requireField: { status: failed },
                          }
                    - type: cel
                      config:
                          expr: 'evidence.hosted_smoke_run.outputs.failureKind == "candidate"'
                          message: Only candidate failures return to building.

        - id: closing
          description: Clean the workspace and record factory closure.
          maxCycles: 5
          work:
              mode: workflow
              workflow:
                  name: nightshift-close
                  inputs:
                      workItem: "${{ self.workItem }}"
                      subjectRoot: '${{ data.latest(self.name, "artifact-workspace").payload.subjectRoot }}'
              resultEvidence: close-run
          transitions:
              - name: complete
                to: done
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: close-run,
                              requireField: { status: succeeded },
                          }
              - name: retry
                to: closing
                gates:
                    - type: evidence-recorded
                      config:
                          { name: close-run, requireField: { status: failed } }

        - id: abort-cleanup
          description: Reclaim generated artifacts while preserving dirty source for audit.
          maxCycles: 5
          work:
              mode: workflow
              workflow:
                  name: nightshift-cleanup
                  inputs:
                      workItem: "${{ self.workItem }}"
                      subjectRoot: '${{ data.latest(self.name, "artifact-workspace").?payload.?subjectRoot.orValue("") }}'
                      evidenceName: abort-cleanup-run
              resultEvidence: abort-cleanup-run
          transitions:
              - name: complete
                to: aborted
                gates:
                    - type: evidence-recorded
                      config:
                          {
                              name: abort-cleanup-run,
                              requireField: { status: succeeded },
                          }

        - id: done
          terminal: true

        - id: aborted
          terminal: true

    globalTransitions:
        - name: abort
          to: abort-cleanup
          gates:
              - type: human-approval
                config: { id: abort-confirmation }
reports:
    require:
        - {
              name: "@swamp/software-factory/work-item-summary",
              methods: [summary],
          }
        - { name: "@mgreten/software-factory-flow-metrics", methods: [summary] }
methods: {}
