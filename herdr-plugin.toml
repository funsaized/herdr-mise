id = "mise.kitchen"
name = "Mise"
version = "0.2.0-rc.1"
min_herdr_version = "0.7.0"
description = "Your coding agents as line cooks — kitchen status in a pane"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "install.sh", "--plugin"]
platforms = ["linux", "macos"]

[[panes]]
id = "kitchen"
title = "Mise Kitchen"
placement = "split"
command = ["./target/herdr-plugin/herdr-mise/current/bin/herdr-mise", "--tui"]

[[actions]]
id = "open"
title = "Open Mise Kitchen"
contexts = ["workspace"]
command = ["sh", "-c", "$HERDR_BIN_PATH plugin pane open --plugin mise.kitchen --entrypoint kitchen --placement split --direction right --focus"]
