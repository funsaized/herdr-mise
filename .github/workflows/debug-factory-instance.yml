name: Debug factory instance
on:
  push:
    branches: [factory-instance]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install pinned Swamp
        run: sh scripts/install-swamp-managed.sh
      - name: Run factory instance integration test
        run: node --test scripts/nightshift-factory-instance.integration.test.mjs
