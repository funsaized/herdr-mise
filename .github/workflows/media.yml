name: Media maintenance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/media/**
      - docs/assets/**
      - docs/product-demo.md
      - .github/workflows/media.yml

permissions:
  contents: read

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix client --no-audit --no-fund
      - name: Install media validators
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm run test:media
      - run: npm run media -- check all
