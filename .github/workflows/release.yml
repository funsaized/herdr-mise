name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - client/**
      - server/**
      - install.sh
      - herdr-plugin.toml
      - scripts/install.test.mjs
      - scripts/package-release.sh
      - scripts/release-policy.mjs
      - scripts/stable-release-gate.mjs
      - scripts/validate-acceptance-evidence.mjs
      - scripts/verify-release-artifact.sh
      - scripts/release-contract.test.mjs
      - acceptance/**
      - docs/acceptance-evidence.schema.json
      - docs/stable-acceptance.template.json
      - docs/releases/**
      - .github/workflows/release.yml
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify_release:
    runs-on: ubuntu-24.04
    outputs:
      release_class: ${{ steps.classify.outputs.release_class }}
      is_prerelease: ${{ steps.classify.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Classify and validate release tag
        id: classify
        shell: bash
        run: |
          if test "$GITHUB_REF_TYPE" = tag; then
            node scripts/release-policy.mjs classify-tag "$GITHUB_REF_NAME"
          else
            echo 'release_class=non-publishing' >>"$GITHUB_OUTPUT"
            echo 'is_prerelease=false' >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: classify_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-12
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - run: npm ci --prefix client
      - run: npm run build
      - run: cargo build --release --locked --bin herdr-mise --target ${{ matrix.target }}
      - name: Retain build environment identity
        shell: bash
        run: |
          {
            rustc --version --verbose
            cargo --version
            node --version
            npm --version
            uname -sm
            if test "$RUNNER_OS" = Linux; then ldd --version | head -1; fi
          } > "$RUNNER_TEMP/build-environment.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-environment-${{ matrix.target }}
          path: ${{ runner.temp }}/build-environment.txt
          retention-days: 30
          if-no-files-found: error
      - name: Assert tag matches authoritative Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-policy.mjs classify-tag "$GITHUB_REF_NAME"
      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/release-certificate.p12"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | openssl base64 -d -A > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "target/${{ matrix.target }}/release/herdr-mise"
          codesign --verify --deep --strict --verbose=2 "target/${{ matrix.target }}/release/herdr-mise"
      - name: Notarize signed CLI binary
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$APPLE_API_PRIVATE_KEY_BASE64"
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          upload="$RUNNER_TEMP/herdr-mise-${{ matrix.target }}.zip"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | openssl base64 -d -A > "$key"
          ditto -c -k --keepParent "target/${{ matrix.target }}/release/herdr-mise" "$upload"
          xcrun notarytool submit "$upload" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          codesign --verify --deep --strict --verbose=2 "target/${{ matrix.target }}/release/herdr-mise"
          # A bare CLI is not an spctl app-assessment target and has no stapling target.
          # notarytool's accepted result plus the surviving Developer ID signature are the applicable evidence.
      - name: Package and verify artifact
        run: |
          sh scripts/package-release.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release/herdr-mise"
          sh scripts/verify-release-artifact.sh dist/*.tar.gz
      - name: Clean signing material
        if: always() && startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/release-certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/herdr-mise-v*-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  stable_acceptance:
    if: needs.classify_release.outputs.release_class == 'stable'
    needs: classify_release
    runs-on: ubuntu-24.04
    environment: stable-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate exact stable acceptance evidence
        shell: bash
        env:
          STABLE_ACCEPTANCE_EVIDENCE_BASE64: ${{ secrets.STABLE_ACCEPTANCE_EVIDENCE_BASE64 }}
        run: |
          test -n "$STABLE_ACCEPTANCE_EVIDENCE_BASE64"
          umask 077
          evidence="$RUNNER_TEMP/stable-acceptance-evidence.json"
          printf '%s' "$STABLE_ACCEPTANCE_EVIDENCE_BASE64" | base64 --decode >"$evidence"
          node scripts/stable-release-gate.mjs \
            --promotion-tag "$GITHUB_REF_NAME" \
            --promotion-commit "$GITHUB_SHA" \
            --evidence "$evidence"
      - name: Clean stable acceptance evidence
        if: always()
        run: rm -f "$RUNNER_TEMP/stable-acceptance-evidence.json"

  publish:
    if: >-
      ${{ always() && startsWith(github.ref, 'refs/tags/') &&
          needs.build.result == 'success' &&
          needs.classify_release.result == 'success' &&
          (needs.classify_release.outputs.release_class == 'prerelease' ||
           needs.stable_acceptance.result == 'success') }}
    needs: [build, classify_release, stable_acceptance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create or validate matching release class
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CLASS: ${{ needs.classify_release.outputs.release_class }}
        shell: bash
        run: |
          node scripts/release-policy.mjs classify-tag "$GITHUB_REF_NAME"
          case "$RELEASE_CLASS" in
            prerelease)
              expected_prerelease=true
              create_flags=(--prerelease --generate-notes)
              ;;
            stable)
              expected_prerelease=false
              notes_template="docs/releases/${GITHUB_REF_NAME}.md"
              notes_file="$RUNNER_TEMP/release-notes.md"
              test -s "$notes_template"
              for heading in Purpose Install 'Herdr compatibility' Limitations; do
                grep -Fxq "## $heading" "$notes_template"
              done
              if grep -Fxq '## Checksums' "$notes_template"; then exit 1; fi
              perl -0777 -pe 's/\r\n?/\n/g; s/\n*\z/\n/' "$notes_template" >"$notes_file"
              printf '\n## Checksums\n\n' >>"$notes_file"
              create_flags=(--notes-file "$notes_file")
              ;;
            *) exit 1 ;;
          esac
          mapfile -t files < <(find dist -maxdepth 1 -type f -print | sort)
          test "${#files[@]}" -eq 6
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            test -s "dist/herdr-mise-${GITHUB_REF_NAME}-${target}.tar.gz"
            test -s "dist/herdr-mise-${GITHUB_REF_NAME}-${target}.tar.gz.sha256"
            if test "$RELEASE_CLASS" = stable; then
              archive="herdr-mise-${GITHUB_REF_NAME}-${target}.tar.gz"
              checksum=$(cut -d ' ' -f 1 "dist/$archive.sha256")
              printf '%s  %s\n' "$checksum" "$archive" >>"$notes_file"
            fi
          done
          printf '%s\n' "${files[@]##*/}" | sort >expected-assets.txt
          if gh release view "$GITHUB_REF_NAME" --json body,isPrerelease,name,tagName >release.json 2>/dev/null; then
            jq -e --arg tag "$GITHUB_REF_NAME" --argjson expected "$expected_prerelease" \
              '.isPrerelease == $expected and .tagName == $tag and .name == $tag' release.json
            if test "$RELEASE_CLASS" = stable; then
              jq -r '.body' release.json | \
                perl -0777 -pe 's/\r\n?/\n/g; s/\n*\z/\n/' >existing-notes.md
              perl -0777 -pe 's/\r\n?/\n/g; s/\n*\z/\n/' \
                "$notes_file" >expected-notes.md
              diff -u expected-notes.md existing-notes.md
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets[].name' | sort >existing-assets.txt
            comm -23 existing-assets.txt expected-assets.txt >unexpected-assets.txt
            test ! -s unexpected-assets.txt
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${create_flags[@]}" --title "$GITHUB_REF_NAME"
          fi
          # Validate every existing byte before uploading anything. A rebuilt,
          # timestamp-signed binary must never replace an accepted RC artifact.
          existing="$RUNNER_TEMP/existing-release"
          mkdir -p "$existing"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets[].name' >existing-assets.txt
          while IFS= read -r asset; do
            test -n "$asset" || continue
            gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir "$existing"
            cmp "dist/$asset" "$existing/$asset"
          done <existing-assets.txt
          for file in "${files[@]}"; do
            if ! test -f "$existing/${file##*/}"; then
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets[].name' | sort >published-assets.txt
          diff -u expected-assets.txt published-assets.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false

  verify-public-release:
    # stable_acceptance is intentionally skipped for prereleases. Use an
    # explicit status guard so that skipped transitive dependency does not
    # suppress public verification after a successful prerelease publish.
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.publish.result == 'success' &&
      needs.classify_release.result == 'success'
    needs: [publish, classify_release]
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Assert public release and verify public downloads
        env:
          RELEASE_CLASS: ${{ needs.classify_release.outputs.release_class }}
        shell: bash
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME"
          curl -q --retry 3 --retry-all-errors --retry-delay 1 \
            --fail --silent --show-error "$api" -o release.json
          case "$RELEASE_CLASS" in
            prerelease) expected_prerelease=true ;;
            stable) expected_prerelease=false ;;
            *) exit 1 ;;
          esac
          test "$(jq '.prerelease' release.json)" = "$expected_prerelease"
          test "$(jq '.assets | length' release.json)" -eq 6
          latest_api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest"
          if test "$RELEASE_CLASS" = stable; then
            curl -q --retry 3 --retry-all-errors --retry-delay 1 \
              --fail --silent --show-error "$latest_api" -o latest.json
            test "$(jq -r '.tag_name' latest.json)" = "$GITHUB_REF_NAME"
          elif curl -q --retry 3 --retry-all-errors --retry-delay 1 \
            --fail --silent --show-error "$latest_api" -o latest.json 2>/dev/null; then
            test "$(jq -r '.tag_name' latest.json)" != "$GITHUB_REF_NAME"
          fi
          base="herdr-mise-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          for name in "$base" "$base.sha256"; do
            url=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' release.json)
            case "$url" in https://github.com/*/releases/download/*) ;; *) exit 1 ;; esac
            curl -q --retry 3 --retry-all-errors --retry-delay 1 \
              --fail --location --silent --show-error "$url" -o "$name"
            test -s "$name"
          done
          if test "${{ runner.os }}" = macOS; then export VERIFY_CODESIGN=1; fi
          sh scripts/verify-release-artifact.sh "$base"
