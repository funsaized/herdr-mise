name: Swamp managed verification
# Runs on every non-draft pull request head. It has no token permissions; the
# trusted gate (swamp-managed-gate.yml, always run from main) decides whether
# this run may set the required status. Pull requests that change
# trust-boundary paths only pass when authored by the code owner from this
# repository, because this file then comes from the pull request itself.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: swamp-managed-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  execute:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-12
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Check out trusted base controls and the exact pull request head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          control="$RUNNER_TEMP/control"
          subject="$RUNNER_TEMP/subject"
          git init "$control"
          git -C "$control" config core.hooksPath /dev/null
          git -C "$control" remote add origin https://github.com/funsaized/herdr-mise.git
          git -C "$control" fetch --no-tags origin "$BASE_SHA"
          git -C "$control" checkout --detach "$BASE_SHA"
          git init "$subject"
          git -C "$subject" config core.hooksPath /dev/null
          git -C "$subject" remote add subject "https://github.com/$HEAD_REPOSITORY.git"
          git -C "$subject" remote add upstream https://github.com/funsaized/herdr-mise.git
          git -C "$subject" fetch --no-tags subject "$HEAD_SHA"
          git -C "$subject" fetch --no-tags upstream "$BASE_SHA"
          git -C "$subject" checkout --detach "$HEAD_SHA"
          test "$(git -C "$control" rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C "$subject" rev-parse HEAD)" = "$HEAD_SHA"
          git -C "$subject" merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
      - name: Install pinned Swamp
        working-directory: ${{ runner.temp }}/control
        run: sh scripts/install-swamp-managed.sh
      - name: Restore trusted Swamp extensions
        env:
          CONTROL_ROOT: ${{ runner.temp }}/control
        run: swamp extension install --repo-dir "$CONTROL_ROOT"
      - name: Resolve Swamp Deno runtime
        run: |
          deno_path="$(swamp doctor extensions --repo-dir "$RUNNER_TEMP/control" --json | jq -er '.denoPath')"
          echo "DENO_EXEC_PATH=$deno_path" >> "$GITHUB_ENV"
      - name: Run shared Swamp verification
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-download-cache
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTROL_ROOT: ${{ runner.temp }}/control
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUBJECT_ROOT: ${{ runner.temp }}/subject
        run: |
          set -eu
          swamp workflow validate verification --repo-dir "$CONTROL_ROOT"
          swamp workflow run verification --repo-dir "$CONTROL_ROOT" \
            --input commit="$HEAD_SHA" \
            --input baseCommit="$BASE_SHA" \
            --input subjectRoot="$SUBJECT_ROOT"
      - name: Collect sanitized diagnostics
        if: failure()
        env:
          CONTROL_ROOT: ${{ runner.temp }}/control
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"
          swamp report get @swamp/workflow-summary --workflow verification --json \
            --repo-dir "$CONTROL_ROOT" > "$RUNNER_TEMP/diagnostics/workflow-summary.json" 2>&1 || true
          swamp data query 'name.startsWith("log-")' \
            --select '{"name": name, "content": content}' --json --repo-dir "$CONTROL_ROOT" \
            > "$RUNNER_TEMP/verification-logs.json" 2>&1 || true
          node -e "const fs=require('node:fs');const root=process.env.RUNNER_TEMP;const summary=process.argv[1];fs.writeFileSync(summary,fs.readFileSync(summary,'utf8').replaceAll(root,'<runner-temp>'));console.log(fs.readFileSync(process.argv[2],'utf8').slice(-131072).replaceAll(root,'<runner-temp>'))" \
            "$RUNNER_TEMP/diagnostics/workflow-summary.json" \
            "$RUNNER_TEMP/verification-logs.json"
          rm -f "$RUNNER_TEMP/verification-logs.json"
          exit 1
      - name: Retain browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-browser-failures
          path: ${{ runner.temp }}/subject/e2e/artifacts/results
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain managed diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swamp-managed-diagnostics
          path: ${{ runner.temp }}/diagnostics
          overwrite: false
          retention-days: 7
