name: Swamp managed verification gate
# Always runs the definition on main. It never checks out or executes pull
# request code: it reads run and pull request metadata through the API and
# sets the required status on the exact head that was verified.
on:
  workflow_run:
    workflows: [Swamp managed verification]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: swamp-managed-gate-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set exact-head managed verification status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repository = 'funsaized/herdr-mise';
            const expectedPath = '.github/workflows/swamp-managed-verification.yml';
            const { owner, repo } = context.repo;
            const run = (await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.payload.workflow_run.id,
            })).data;
            const workflow = (await github.rest.actions.getWorkflow({
              owner, repo, workflow_id: run.workflow_id,
            })).data;
            if (workflow.path !== expectedPath || run.event !== 'pull_request') {
              throw new Error('workflow_run does not identify the managed pull request executor');
            }
            // Drafts are skipped and superseded heads are cancelled; the run
            // for the current head sets the status.
            if (['skipped', 'cancelled'].includes(run.conclusion)) {
              core.notice(`No status for ${run.conclusion} run ${run.id}`);
              return;
            }
            const head = `${run.head_repository.owner.login}:${run.head_branch}`;
            const candidates = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', head, per_page: 100,
            });
            const pr = candidates.find((candidate) =>
              candidate.head.sha === run.head_sha &&
              candidate.head.repo?.id === run.head_repository.id &&
              candidate.base.repo.full_name === repository
            );
            if (!pr) {
              core.notice(`Head ${run.head_sha} is no longer the head of an open pull request`);
              return;
            }
            const policyFile = (await github.rest.repos.getContent({
              owner, repo, path: 'verification/managed-policy.json', ref: 'main',
            })).data;
            if (Array.isArray(policyFile) || policyFile.type !== 'file' || policyFile.size > 128 * 1024) {
              throw new Error('trusted managed policy is missing or oversized');
            }
            const policy = JSON.parse(Buffer.from(policyFile.content, 'base64'));
            if (
              typeof policy.codeOwner !== 'string' || !Array.isArray(policy.trustBoundaryPaths) ||
              policy.trustBoundaryPaths.length < 1 ||
              policy.trustBoundaryPaths.some((path) => typeof path !== 'string' || path.startsWith('/') || path.includes('..'))
            ) throw new Error('trusted trust-boundary policy is malformed');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const matches = (path, pattern) => pattern.endsWith('/**')
              ? path.startsWith(pattern.slice(0, -2))
              : path === pattern;
            const touched = files
              .flatMap(({ filename, previous_filename }) => previous_filename ? [filename, previous_filename] : [filename])
              .filter((path) => policy.trustBoundaryPaths.some((pattern) => matches(path, pattern)));
            // A trust-boundary change can rewrite the executor itself, so only
            // the code owner's own pull requests from this repository pass.
            const ownerChange = pr.user.login === policy.codeOwner && pr.head.repo.full_name === repository;
            let state = 'failure';
            let description = `Managed verification ${run.conclusion}`;
            if (touched.length && !ownerChange) {
              description = 'Trust-boundary change requires a code-owner pull request from this repository';
            } else if (run.conclusion === 'success') {
              state = 'success';
              description = 'Managed verification passed for this exact head';
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: run.head_sha, state, description,
              context: 'Swamp managed verification',
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            core.summary.addRaw(
              `PR #${pr.number} head ${run.head_sha}: ${state} (${description}); run ${run.html_url}; trust-boundary files: ${touched.length}`,
            );
            await core.summary.write();
