name: Herdr compatibility regression and discovery
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: herdr-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Immutable supported-matrix regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: herdrdev/herdr
          ref: ef4c23f5775bb8cfec05f05d0844226ff959a07a
          path: upstream/herdr-075
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: herdrdev/herdr
          ref: 346411fa21afd297f5ed3b3fa56f9e3fbf7654b7
          path: upstream/herdr-080
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: herdrdev/herdr
          ref: 9eb521456ac0d19d3ab3d9d7cea3cca10baa8a4c
          path: upstream/herdr-082
          persist-credentials: false
      - run:
          npm run check:herdr-compatibility -- --upstream=0.7.5=upstream/herdr-075
          --upstream=0.8.0=upstream/herdr-080
          --upstream=0.8.2=upstream/herdr-082
  discovery:
    name: Read-only upstream candidate discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/install-swamp-managed.sh
      - run: swamp extension install
      - name: Install mandatory sandbox
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: swamp workflow validate herdr-release-discovery
      - run: swamp workflow run herdr-release-discovery
      - name: Summarize candidates without modifying support
        if: always()
        run: swamp report get @funsaized/herdr-release-discovery --model herdr-upstream >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize advisory preview canary
        if: always()
        run: |
          swamp data get verification-rust preview-canary-result --json > preview-canary-result.json || printf '{"status":"unavailable"}\n' > preview-canary-result.json
          printf '\n### Preview canary\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat preview-canary-result.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized preview canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: herdr-preview-canary
          path: preview-canary-result.json
          retention-days: 7
