name: Herdr compatibility regression and discovery
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: herdr-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Immutable supported-matrix regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: herdrdev/herdr
          ref: ef4c23f5775bb8cfec05f05d0844226ff959a07a
          path: upstream/herdr-075
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: herdrdev/herdr
          ref: 346411fa21afd297f5ed3b3fa56f9e3fbf7654b7
          path: upstream/herdr-080
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: herdrdev/herdr
          ref: 9eb521456ac0d19d3ab3d9d7cea3cca10baa8a4c
          path: upstream/herdr-082
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: herdrdev/herdr
          ref: 98307c509e9688575d006b47d26d0db561cda0a4
          path: upstream/herdr-p21
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: herdrdev/herdr
          ref: b99002ac99b09e00b4ca692436cb15a6b0d676f1
          path: upstream/herdr-090
          persist-credentials: false
      - run:
          npm run check:herdr-compatibility -- --upstream=17=upstream/herdr-075
          --upstream=19=upstream/herdr-080
          --upstream=20=upstream/herdr-082
          --upstream=21=upstream/herdr-p21
          --upstream=22=upstream/herdr-090
  discovery:
    name: Read-only upstream candidate discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Summarize upstream releases without changing support
        run: node scripts/discover-herdr-releases.mjs >> "$GITHUB_STEP_SUMMARY"
