name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-12
        with:
          components: rustfmt
      - name: Test Rust workspace with fallback assets
        run: |
          test ! -e client/dist
          cargo test --workspace --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - name: Test Rust workspace with production assets
        run: cargo test --workspace --locked
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:herdr-compatibility
      - run: npm run test:visual
      - run: npm run audit:tokens
      - run: npm run audit:accessibility
      - run: npm run check:bundle
      - run: npm run bundle
      - run: npm run validate:release

  rust-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-12
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the committed Rust lockfile
        run: cargo audit --file Cargo.lock --deny warnings
