name: CI
on:
  push:
    branches-ignore:
      - ops/evidence
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-feedback:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix client --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm --prefix client test
      - name: Explain advisory status and authoritative verification
        if: always()
        env:
          CHECKED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Fast feedback for head: $CHECKED_HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo 'This lane is advisory. A maintainer must dispatch Swamp managed verification for the exact current PR head. Every new commit or rebase requires a new managed run; trust-boundary changes require funsaized.' >> "$GITHUB_STEP_SUMMARY"
          echo '[Managed verification runs](https://github.com/funsaized/herdr-mise/actions/workflows/swamp-managed-verification.yml)' >> "$GITHUB_STEP_SUMMARY"
  rust-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-12
        with:
          toolchain: 1.97.1
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the committed Rust lockfile
        run: cargo audit --file Cargo.lock --deny warnings
